name: Compiler APK Android KeoTV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  build-apk:
    name: Génération de l'APK Android TV & Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v4

      - name: Installation des dépendances
        run: npm install

      - name: Construction de l'application Web (Next.js export)
        run: npm run build
        env:
          NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qvfmfstwrkcerzlbemzb.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2Zm1mc3R3cmtjZXJ6bGJlbXpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjE1NDksImV4cCI6MjEwNzYzNzU0OX0.-VCES2YX_FDjWct12sTgTaDtfqnqUfXfPcMS39UmRBs' }}

      - name: Initialisation du projet Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Installation du lecteur vidéo natif ExoPlayer (Media3)
        run: |
          SRC_DIR="android/app/src/main/java/fr/keo/tv"
          mkdir -p "$SRC_DIR"
          cp native-android/MainActivity.java "$SRC_DIR/MainActivity.java"
          cp native-android/NativePlayerPlugin.java "$SRC_DIR/NativePlayerPlugin.java"
          cp native-android/PlayerActivity.java "$SRC_DIR/PlayerActivity.java"

          GRADLE="android/app/build.gradle"
          if ! grep -q "androidx.media3" "$GRADLE"; then
            sed -i '/^dependencies {/a\    implementation "androidx.media3:media3-exoplayer:1.5.1"\n    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"\n    implementation "androidx.media3:media3-ui:1.5.1"' "$GRADLE"
          fi
          if ! grep -q "abortOnError" "$GRADLE"; then
            sed -i '/^android {/a\    lint {\n        abortOnError false\n        checkReleaseBuilds false\n    }' "$GRADLE"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "fr.keo.tv.PlayerActivity\|\.PlayerActivity" "$MANIFEST"; then
            sed -i 's#</application>#        <activity android:name=".PlayerActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout" android:theme="@style/Theme.AppCompat.NoActionBar" />\n    </application>#' "$MANIFEST"
          fi

          echo "--- build.gradle (extrait) ---"
          grep -n "media3\|abortOnError" "$GRADLE" || true
          echo "--- AndroidManifest ---"
          cat "$MANIFEST"

      - name: Configuration du support Android TV (Leanback & Banner)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Ajout des déclarations Leanback (TV) non restrictives pour garder le support smartphone
          if ! grep -q "android.software.leanback" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />' "$MANIFEST"
          fi

          # Ajout de la catégorie LEANBACK_LAUNCHER pour que l'app apparaisse sur le launcher Android TV
          if ! grep -q "android.intent.category.LEANBACK_LAUNCHER" "$MANIFEST"; then
            sed -i '/android.intent.category.LAUNCHER/a \                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' "$MANIFEST"
          fi

          # Ajout de la bannière TV dans la balise application
          if ! grep -q "android:banner" "$MANIFEST"; then
            sed -i 's/<application/<application android:banner="@drawable\/tv_banner"/' "$MANIFEST"
          fi

          # Autoriser les flux HTTP non-chiffrés indispensables pour les serveurs IPTV Xtream
          if ! grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

          # Permettre le mode paysage natif Android TV en évitant le verrouillage portrait
          sed -i 's/android:screenOrientation="portrait"/android:screenOrientation="unspecified"/g' "$MANIFEST"

      - name: Génération automatique des icônes Android et de la Bannière Android TV
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/drawable
          # Bannière Android TV 16:9 (320x180)
          rsvg-convert -w 320 -h 180 public/icon.svg -o android/app/src/main/res/drawable/tv_banner.png

          # Supprimer le dossier anydpi-v26 pour éviter que l'icône adaptative par défaut de Capacitor masque notre icône
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # Générer les icônes standard, rondes et premier plan (foreground) pour toutes les densités
          for density_spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${density_spec%%:*}"
            size="${density_spec##*:}"
            target_dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$target_dir"
            rsvg-convert -w "$size" -h "$size" public/icon.svg -o "$target_dir/ic_launcher.png"
            rsvg-convert -w "$size" -h "$size" public/icon.svg -o "$target_dir/ic_launcher_round.png"
            rsvg-convert -w "$size" -h "$size" public/icon.svg -o "$target_dir/ic_launcher_foreground.png"
          done

      - name: Configuration de la version Android strictement incrémentale
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle

      - name: Compilation Release et Signature Cryptographique Officielle Permanente
        working-directory: android
        run: |
          chmod +x ./gradlew
          echo "🚀 Compilation Release officielle avec Gradle..."
          ./gradlew assembleRelease --stacktrace

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK généré : $UNSIGNED_APK"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name zipalign 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$ZIPALIGN" ] && ! $ZIPALIGN -c 4 "$UNSIGNED_APK"; then
            echo "Alignement 4-byte de l'APK..."
            $ZIPALIGN -p -f 4 "$UNSIGNED_APK" aligned.apk
            UNSIGNED_APK="aligned.apk"
          fi

          KEYSTORE_PATH="../keystore/keotv.keystore"
          echo "🔑 Signature avec le trousseau cryptographique permanent KeoTV ($KEYSTORE_PATH)..."

          $APKSIGNER sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "keonote" \
            --ks-pass "pass:keonotepassword" \
            --key-pass "pass:keonotepassword" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../KeoTV.apk \
            "$UNSIGNED_APK"

          echo "🛡️ Validation de l'APK signé cryptographiquement :"
          $APKSIGNER verify --verbose ../KeoTV.apk
          cp ../KeoTV.apk "../KeoTV-Build-${{ github.run_number }}.apk"

      - name: Publication de l'APK en téléchargement (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: keotv-android-apk
          path: |
            KeoTV.apk
            KeoTV-Build-${{ github.run_number }}.apk
          retention-days: 30

      - name: Publication automatique sur GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: "KeoTV v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### 📺 KeoTV v1.0.0 (Build ${{ github.run_number }})
            Cliquez sur le fichier **KeoTV-Build-${{ github.run_number }}.apk** ci-dessous pour installer ou mettre à jour directement votre application.

            #### 🚀 Nouveautés & Correctifs Majeurs (Build 15) :
            - **Fiche détaillée pour les Films (intermédiaire avant lecture)** : Un clic sur un film ouvre désormais sa fiche complète avec image de fond, affiche, note IMDb, durée, réalisateur, synopsis en français, pistes audio et sous-titres, et grand bouton "Lancer le film".
            - **Distribution & Filmographie croisée avec votre Playlist** : Cliquez sur n'importe quel acteur de la distribution pour voir immédiatement tous ses autres films disponibles dans votre playlist IPTV personnelle !
            - **Langues Audio et Sous-titres (Séries & Films)** : Détection et affichage clair des langues disponibles (Français VF, VOSTFR, Multilingue, VO, etc.).
            - **Raccourci Downloader Android TV** : Tapez `tinyurl.com/keotv-apk` dans la barre URL de l'application Downloader sur votre télévision.
            - **Mise à jour directe sans désinstallation** : Signature cryptographique officielle permanente (`versionCode ${{ github.run_number }}`).
          files: |
            KeoTV.apk
            KeoTV-Build-${{ github.run_number }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
