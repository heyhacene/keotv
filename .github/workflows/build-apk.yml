name: Compiler APK Android KeoTV (Natif Pur)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilation Release Native Android TV
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v4

      - name: Génération des icônes et de la Bannière Android TV
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/drawable
          # Bannière Android TV 16:9 (320x180)
          rsvg-convert -w 320 -h 180 public/icon.svg -o android/app/src/main/res/drawable/tv_banner.png

          # Générer les icônes standard et rondes pour toutes les densités
          for density_spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${density_spec%%:*}"
            size="${density_spec##*:}"
            target_dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$target_dir"
            rsvg-convert -w "$size" -h "$size" public/icon.svg -o "$target_dir/ic_launcher.png"
            rsvg-convert -w "$size" -h "$size" public/icon.svg -o "$target_dir/ic_launcher_round.png"
          done

      - name: Configuration de la version Android strictement incrémentale
        run: |
          sed -i 's/versionCode [0-9]\+/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "[0-9.]\+"/versionName "1.4.${{ github.run_number }}"/g' android/app/build.gradle

      - name: Compilation Release et Signature Cryptographique Officielle Permanente
        working-directory: android
        run: |
          chmod +x ./gradlew
          echo "🚀 Compilation Release officielle native avec Gradle..."
          ./gradlew assembleRelease --stacktrace --info || { echo "❌ Gradle compilation failed!"; exit 1; }

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK généré : $UNSIGNED_APK"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name zipalign 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$ZIPALIGN" ] && ! $ZIPALIGN -c 4 "$UNSIGNED_APK"; then
            echo "Alignement 4-byte de l'APK..."
            $ZIPALIGN -p -f 4 "$UNSIGNED_APK" aligned.apk
            UNSIGNED_APK="aligned.apk"
          fi

          KEYSTORE_PATH="../keystore/keotv.keystore"
          echo "🔑 Signature avec le trousseau cryptographique permanent KeoTV ($KEYSTORE_PATH)..."

          $APKSIGNER sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "keonote" \
            --ks-pass "pass:keonotepassword" \
            --key-pass "pass:keonotepassword" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../KeoTV.apk \
            "$UNSIGNED_APK"

          echo "🛡️ Validation de l'APK signé cryptographiquement :"
          $APKSIGNER verify --verbose ../KeoTV.apk
          cp ../KeoTV.apk "../KeoTV-Build-${{ github.run_number }}.apk"

      - name: Publication de l'APK en téléchargement (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: keotv-android-apk
          path: |
            KeoTV.apk
            KeoTV-Build-${{ github.run_number }}.apk
          retention-days: 30

      - name: Publication automatique sur GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.${{ github.run_number }}-build.${{ github.run_number }}
          name: "KeoTV 100% Natif v1.4.${{ github.run_number }} (Build ${{ github.run_number }})"
          body: |
            ### 📺 KeoTV v1.4.${{ github.run_number }} (Architecture 100% Native Android)
            Cliquez sur le fichier **KeoTV-Build-${{ github.run_number }}.apk** ci-dessous pour installer l'application 100% native sur votre Android TV.

            #### 🚀 Nouvelle Fondation Native (Zéro WebView) :
            - **Moteur 100% Natif (Modèle TiviMate)** : Suppression totale de la WebView et de JavaScript. Exécution directe sur la puce Android TV.
            - **Base de Données SQLite WAL Native** : Enregistrement et lecture en tâche de fond (multi-thread) sans aucun freeze d'interface.
            - **Navigation D-Pad Matérielle** : Navigation directe télécommande Android dans les bouquets et les chaînes.
            - **Lecteur AndroidX Media3 (ExoPlayer)** : Décodage matériel direct, zapping ultra-rapide.
          files: |
            KeoTV.apk
            KeoTV-Build-${{ github.run_number }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
